name: Проверки

# Запускается сам: на каждый push и на каждый pull request.
# Локально ничего устанавливать и запускать не нужно — всё делает GitHub.
on:
  push:
  pull_request:

jobs:
  site:
    name: Сайт — типы, сборка, браузерные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов (app.ts)
        run: npm run typecheck

      - name: Сборка app.js из app.ts
        run: npm run build

      - name: app.js в репозитории совпадает с app.ts
        run: |
          if ! git diff --quiet -- app.js; then
            echo "::error::app.js устарел: выполните 'npm --prefix site run build' и закоммитьте результат."
            git diff --stat -- app.js
            exit 1
          fi

      - name: Правила оценивания и SQL/RLS (без браузера)
        run: npm run test:unit

      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

      - name: Установка Chromium
        run: npx playwright install --with-deps chromium

      - name: Браузерные тесты (desktop + mobile)
        run: npx playwright test

      - name: Отчёт о падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7
