name: Деплой сайта

# Сайт — это Cloudflare Worker (wrangler.jsonc): статика site/ + прокси
# /api/genius/*. Деплой запускается сам на каждый push в main и в рабочую
# ветку, а также вручную: Actions → «Деплой сайта» → Run workflow.
#
# Один раз добавь два секрета (Settings → Secrets and variables → Actions →
# New repository secret):
#   CLOUDFLARE_API_TOKEN  — токен из Cloudflare (шаблон «Edit Cloudflare Workers»);
#   CLOUDFLARE_ACCOUNT_ID — Account ID из Cloudflare (Workers & Pages → Overview).
# Пока CLOUDFLARE_API_TOKEN не задан, шаг деплоя просто пропускается.

on:
  push:
    branches: [main, arena/01a0aed2-albumratingrepository]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Деплой воркера
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "Секрет CLOUDFLARE_API_TOKEN не задан — деплой пропущен."
            echo "Добавь его: Settings → Secrets and variables → Actions → New repository secret."
            exit 0
          fi
          # Account ID необязателен: если секрет не задан, убираем пустую переменную,
          # чтобы wrangler определил аккаунт по токену.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@4 deploy
